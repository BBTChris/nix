# =============================================================================
# debug.md §7.12 — THE STANDING QUESTION, answered in writing beside the gate.
#
#   "What would have to be true for `pre-commit run --all-files` to pass while
#    measuring nothing?"
#
# Every answer below is a condition you could plant. NO CURRENT-STATE NUMBER IS
# RESTATED HERE (doctrine B.7 / CHECK-DEBT D2.8) — where a count is needed, the
# command that derives it is given instead. Historical measurements appear only
# with the arc and commit that produced them, which makes them evidence rather
# than a claim about today.
#
# 1. THE SUBJECT IS NOT IN `git ls-files`.  `--all-files` means all *git-tracked*
#    files, so anything untracked or gitignored is outside all seven file-scoped
#    hooks below. This is failure mode #14 and it is LIVE IN THIS TREE TODAY:
#    `.gitignore` excludes `state/` wholesale, and `state/encrypt_credentials.py`
#    is real Python that no hook has ever read (CHECK-DEBT D1.16). It was also
#    the ARC 015 instance — `scripts/broker/` sat untracked and permanently green.
#    Plantable in one command: `git rm --cached <file>` silences every hook on it
#    with no diff to this file.
#    NUANCE, measured ARC 017 — pre-commit does NOT report a *totally* empty
#    file-scoped hook as Passed; it prints "(no files to check) Skipped". So a
#    scope collapse to ZERO is visible for the seven file-scoped hooks. What is
#    invisible is a PARTIAL collapse — one file fewer reads exactly like the full
#    set. `pytest-affected` used to be exempt from the protection entirely,
#    because `always_run: true` + `pass_filenames: false` means it is never
#    "skipped for no files"; it reported **Passed** on zero tests. Answer 2 is
#    the repair.
#
# 2. testmon SELECTED NOTHING — AND THAT USED TO BE EXIT 0.  Measured ARC 017 and
#    re-measured ARC 018 (pytest 9.1.1 + testmon 2.2.0): a warm `--testmon` run
#    with an unchanged dependency graph prints `changed files: 0`, `collected 0
#    items`, `no tests ran`, and exits **0**. Exit-5 tolerance never covered it —
#    exit 5 is the `-k` deselect path and testmon's empty run never reaches it.
#    **CLOSED ARC 018 (CHECK-DEBT D2.13).** The hook no longer runs bare pytest;
#    it runs the runtime-gate program spelled out in the `entry:` at the bottom
#    of this file, which turns "selected nothing" into a named, non-green verdict
#    and then escalates to a full non-incremental run so that the commit is
#    measured rather than waved through. See the block above that entry for the
#    verdict taxonomy and for what remains undetectable.
#
# 3. THE RUNTIME GATE'S SCOPE LIVES IN AN UNTRACKED FILE.  `.testmondata` is
#    gitignored (see `.gitignore`) and per-machine. Delete it and the next run is
#    exhaustive; corrupt or stale it and the run can be empty. No reviewer sees
#    it and no commit records it. Failure mode #14, one layer down.
#    **NARROWED ARC 018, not closed.** The file is still untracked and still
#    per-machine — tracking it was rejected (binary SQLite plus WAL sidecars is a
#    second source of truth that goes stale on write; ARC 016 rejected the same
#    shape for `downloads/*.py`). What changed is that its *state* is now an
#    explicit input to the verdict and is printed on every run: `db=` absent /
#    present / unreadable, `known_files=`, `uncovered=`, `drift=`, `alien_env=`.
#    A missing database cannot narrow scope (it forces a cold exhaustive run), a
#    foreign one is named, a stale one is caught by an independent recomputation
#    of the very hashes it stores, and a partial one is listed file by file.
#    MEASURED ARC 018, and this is the part that matters: the fsha of ONE file in
#    `.testmondata` was overwritten with zeroes and testmon still reported
#    `changed files: 0` / `collected 0 items` / exit 0. The selector did not
#    notice its own corrupted record. The independent recomputation did.
#
# 4. A STALE HOOK ENVIRONMENT IS STILL ON DISK.  `~/.cache/pre-commit` holds more
#    than one bandit env. The pre-ARC-010 one (repo rev 2d0b675) still reproduces
#    the original defect exactly. RE-MEASURED ARC 018 by invoking that cached
#    env's own bandit against this tree: EVERY production file came back
#    "exception while scanning file", zero findings, **exit 0** — and a file
#    containing `subprocess.run(cmd, shell=True)` was skipped the same way and
#    also passed, while the pinned 1.9.4 env flags it High and exits 1. Only the
#    `rev:` pin below routes
#    around it, and a pin is a declaration, not evidence. Checking out any commit
#    that moves that pin re-arms the ARC 006 vacuum with no visible change to the
#    gate. CHECK-DEBT D1.10 owns the missing assertion.
#
# 5. THE HOOK REPAIRED THE DEFECT INSTEAD OF REPORTING IT.  **CLOSED for
#    ruff-format ARC 018 (CHECK-DEBT D3.5)** — the hook now carries `--check`, so
#    it reports `file:line` and leaves the file byte-identical instead of
#    rewriting it and letting pre-commit infer a failure from a tree hash. Note
#    the condition still holds for `ruff-check`, which keeps `--fix`; that is a
#    deliberate, separate decision and not something this arc touched.
#
# 6. THE HOOK CANNOT REPORT ITS OWN SCOPE, so a collapse to zero is unobservable.
#    As configured, `ruff-check` prints only "All checks passed!" and `pylint`
#    prints only a rating — neither emits a file count, though both can
#    (`ruff check --statistics` / `--show-files`; `pylint --reports=y`). The
#    others self-report: ruff-format "N files already formatted", mypy "N source
#    files", complexipy "N files analyzed", bandit "Files skipped" plus LOC
#    scanned, and the runtime gate prints an explicit `SELECTED=` on every run.
#
# 7. THE GATE'S OWN LOGIC IS OUTSIDE EVERY GATE.  New with the ARC 018 repair and
#    stated rather than hidden: the runtime-gate program lives in the `entry:`
#    string below, so ruff, pylint, mypy, bandit, complexipy and pytest all see a
#    YAML file and none of them see that Python. Its correct home is a tracked
#    `scripts/runtime_gate.py` with its own tests; ARC 018's sub-agent A had no
#    write access to `scripts/`. Recorded as CHECK-DEBT D2.16.
#
# Per-hook scope is DERIVED, never restated. Reproduce it with pre-commit's own
# Classifier rather than a reimplementation:
#
#   .venv/bin/python - <<'PY'
#   from pre_commit.clientlib import load_config
#   from pre_commit.commands.run import Classifier
#   from pre_commit.repository import all_hooks
#   from pre_commit.store import Store
#   from pre_commit import git
#   files = git.get_all_files(); print("all_files", len(files))
#   c = Classifier.from_config(files, "", "^$")
#   for h in all_hooks(load_config(".pre-commit-config.yaml"), Store()):
#       print(h.alias or h.id, len(list(c.filenames_for_hook(h))))
#   PY
#
# HISTORY, because it is the point: ARC 017 banked that table as literal counts
# in this header — all_files 87, four hooks at 37, bandit 18/19, complexipy 37,
# `git ls-files '*.py'` 38. Every one of those was correct at commit 92f9f17 and
# WRONG by commit b8ba7ff, because ARC 017's own commits added files. The numbers
# went stale inside the arc that wrote them. That is CHECK-DEBT D2.8's failure
# class living inside a gate's configuration for the second time, and it is why
# the command above replaced the table instead of the table being updated.
# =============================================================================

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # ARC 035 / 0.2 — THE MON-1 TRIO IS EXCLUDED, AND THE EXCLUSION IS THE
      # HONEST FORM OF A STATE THAT WAS ALREADY TRUE.
      #
      # `scripts/monitor.py`, `scripts/harness.py` and `scripts/pty_test.py` are
      # the operator-deprecated MON-1 TUI (CHECK-DEBT D3.113: "the tooling is
      # deprecated and not being extended"). pre-commit lints CHANGED files, and
      # these three had not changed since before any of these hooks existed, so
      # they had never once been scanned. ARC 035 fixed a genuine portability
      # defect in `harness.py` — a hard-coded `/home/claude/work/monitor.py`, an
      # absolute path from another machine — and that ONE LINE dragged 3,200
      # lines of retired tooling into six linters for the first time: ~80 pylint
      # findings, 15 mypy errors, a dozen bandit issues, and a `render_all` at
      # cognitive complexity 19.
      #
      # Three options, and why this one: lint-cleaning a retired TUI is exactly
      # the work the MON-1 ruling says not to do; reverting the fix would leave a
      # known-wrong absolute path in the tree to keep a linter quiet; excluding
      # them CHANGES NOTHING ABOUT WHAT IS ACTUALLY SCANNED and makes the
      # existing zero visible instead of accidental. The scan count was zero
      # before this line and is zero after it.
      #
      # What still covers them: `checks/check_monitor_tui.py` EXECUTES all three
      # and pins their measured behaviour two-way, which is strictly more than
      # any of these hooks was doing. If MON-1 is ever revived, this exclusion
      # comes off in the same arc — recorded as CHECK-DEBT.
        exclude: ^(databases/schema/|scripts/(harness|monitor|pty_test)\.py$)

      # RULING, ARC 017 — this was a FORMATTER, not a gate. FAIL-with-CONTROL was
      # run and the verdict was CAUGHT BUT DID NOT NAME THE SITE, recorded as
      # CHECK-DEBT D3.5 and deliberately left OPEN rather than rounded up. What
      # was measured then:
      #   - The hook entry is `ruff format --force-exclude`. It REWRITES the
      #     file. `ruff format` itself exits 0 — it succeeded at formatting.
      #   - The exit 1 came from pre-commit's own before/after tree hash, as
      #     "files were modified by this hook". That signal is attributed by
      #     tree-diff, not by causation: during ARC 017 a *concurrent* edit by
      #     another process made the **bandit** hook report "files were modified
      #     by this hook" though bandit never writes a file. Any evidence resting
      #     on that message is unreliable whichever hook it names.
      #   - It named no file and no line, and running it twice made the second
      #     run PASS, because the gate consumed its own subject (failure mode #7,
      #     and §7.12 answer 5 above).
      #
      # ADOPTED ARC 018 — `args: [--check]` converts it from a repairer into a
      # reporter, which is what doctrine C.2 and failure mode #7 require. It now
      # exits 1, names `<file>:<line>:<col>`, prints the diff, and leaves the
      # tree byte-identical, so the failure survives to be read instead of being
      # silently consumed. The ergonomic cost is real and is accepted rather than
      # hidden: commits are no longer auto-formatted, and the fix is to run
      # `.venv/bin/ruff format <file>` by hand. `ruff-check` above keeps `--fix`,
      # so that answer-5 condition is still live for that hook by choice.
      - id: ruff-format
        args: [--check]
        exclude: ^(databases/schema/|scripts/(harness|monitor|pty_test)\.py$)

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
        args: ["--fail-on=E,F"]
        exclude: ^(databases/schema/|scripts/(harness|monitor|pty_test)\.py$)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        exclude: ^(databases/schema/|scripts/(harness|monitor|pty_test)\.py$)

  # 1.8.6 -> 1.9.4 (ARC 010). 1.8.6 dies on every file containing a string
  # literal under Python 3.14: node_visitor.visit_Str does `node.s`, and 3.14
  # removed the `.s` alias from ast.Constant. Bandit catches that per file,
  # records "exception while scanning file", and exits 0 — so the gate had
  # scanned 0 of 27 files, with a clean green, since ARC 006. Proven by
  # planting `subprocess.run(cmd, shell=True)`: 1.8.6 passed it, 1.9.4 fails
  # it as B602 and names the line. Two hook entries, not one, so the strict
  # rule set stays whole over production code.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (production)
        args: ["-c", "pyproject.toml"]
        exclude: ^(databases/schema/|scripts/tests/|scripts/(harness|monitor|pty_test)\.py$)

      - id: bandit
        alias: bandit-tests
        name: bandit (tests)
        # Scoped skips, each measured against this repo rather than assumed.
        # This narrows three *rules* over the test tree; it does not narrow the
        # gate's *scope* — every file is still scanned, and every other rule
        # (B602 shell=True included) stays live here. See nix_check_contract.md
        # §5.2 on why scope exemptions are the wrong repair.
        # CAN-FAIL DEMONSTRATED, ARC 017 — CHECK-DEBT D3.6, opened and
        # discharged in the same arc because it was owed and unrecorded for
        # four arcs. The plant landed inside this hook's OWN scope:
        # `subprocess.run(cmd, shell=True)` appended to
        # scripts/tests/test_systemd_units.py. CAUGHT as B602, Severity High /
        # Confidence High, naming the site
        # `./scripts/tests/test_systemd_units.py:77:4` and printing the line.
        # Restored byte-identical (sha256 85d2b8d0…bee9a before and after) and
        # the control re-passed. Non-vacuity first: bandit's own JSON metrics
        # matched the file count pre-commit's Classifier selects for this hook.
        # D3.1's ARC 010 discharge covered bandit (production) ONLY — that plant
        # landed in checks/check_venv.py, which this hook's `files:` excludes.
        #   B101 assert_used  — asserts are pytest's assertion mechanism, and
        #                       zero of them is a defect. THE SITE COUNT IS
        #                       DELIBERATELY NOT RESTATED HERE (doctrine B.7 /
        #                       CHECK-DEBT D2.8). It used to read "126 tests,
        #                       ~100 sites"; ARC 017 derived different figures
        #                       and both restatements were stale. Derive:
        #                         bandit -c pyproject.toml -f json \
        #                           $(git ls-files 'scripts/tests/*.py')
        #                       then count results with test_id == "B101".
        #   B404 import subprocess — informational "consider the implications";
        #                       the suite must spawn interpreters to test the
        #                       checks that spawn interpreters.
        #   B603 subprocess-without-shell — fires on the *safe* list form. Every
        #                       site is sys.executable with a literal argv.
        args: ["-c", "pyproject.toml", "--skip", "B101,B404,B603"]
        files: ^scripts/tests/

  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v3.0.0
    hooks:
      - id: complexipy
        exclude: ^(databases/schema/|scripts/(harness|monitor|pty_test)\.py$)

  - repo: local
    hooks:
      - id: pytest-affected
        name: Stage 3 — runtime pass
        # ---------------------------------------------------------------------
        # THE RUNTIME GATE — rebuilt ARC 018 to discharge CHECK-DEBT D2.13.
        #
        # WHAT WAS WRONG. The entry was `./.venv/bin/pytest --testmon`. A warm
        # testmon graph selects nothing, prints `collected 0 items`, and exits 0,
        # so pre-commit printed **Passed** for a run that executed no test. The
        # defect is NOT that testmon selects nothing — selecting nothing is
        # correct when nothing changed. The defect is that a run which measured
        # nothing was indistinguishable from a run that measured everything and
        # passed. Removing the old exit-5 tolerance never touched this: exit 5
        # belongs to the `-k` deselect path.
        #
        # WHAT REPLACED IT, and why this shape. Two rejected alternatives first,
        # because the rejection is the argument:
        #   - Sweep the whole suite every commit. Trades a silent-green defect
        #     for a gate people route around, which §7.12 says is worse.
        #   - Assert a floor on the collected count. A floor is a literal anchor
        #     (failure mode #4) and it cannot tell "nothing changed" from "the
        #     selector is broken".
        # Instead the gate reads the state of `.testmondata` ITSELF, before and
        # around the run, and makes that state part of the verdict. Zero
        # selection stops being a terminal state: it is named, and then the gate
        # escalates to a non-incremental run so the commit is actually measured.
        # Incremental stays the fast path for the case it is good at — a commit
        # that touched code testmon has a graph for.
        #
        # VERDICT TAXONOMY, printed verbatim on every run, PASS only at the end:
        #   MEASURED-PASS     exit 0  SELECTED>0 and every selected test passed
        #   FAIL              exit 1  pytest failed; pytest named the site above
        #   SELECTOR-BROKEN   exit 1  nothing selected, yet the gate's own
        #                             recomputation says the database's record
        #                             disagrees with the tree, or the database
        #                             records a failed test nobody re-ran
        #   SCOPE-BLIND       exit 2  a file changed against HEAD that the
        #                             database has no fingerprint for, so a
        #                             change to it can select nothing
        #   NOTHING-SELECTED  exit 2  nothing selected and nothing contradicts
        #                             that — the legitimate "nothing changed"
        #                             outcome, and it is CANNOT-MEASURE, not PASS
        #   CANNOT-MEASURE    exit 2  database unreadable, or pytest produced no
        #                             parsable report (exit 2 keeps this distinct
        #                             from FAIL — failure mode #10, and Part B.2
        #                             of VERIFY-AND-CHECKS)
        # SCOPE-BLIND and NOTHING-SELECTED are only reachable when escalation is
        # suppressed with NIX_RUNTIME_GATE=noescalate. That switch exists so the
        # taxonomy is demonstrable — run it and the gate will tell you which of
        # the three zero-selection worlds you are in. With escalation on (the
        # default, and what a commit uses) those two states are repaired into a
        # real measurement instead of being reported as a pass.
        #
        # HOW THE DATABASE IS AUDITED. `fsha` in testmon's `file_fp` table is a
        # git blob hash of the file. The gate recomputes it from the working
        # tree with hashlib and compares — it never asks testmon what changed,
        # which is what makes the corroboration independent. Both of testmon's
        # own spellings are accepted (`git ls-files --stage` index hash for a
        # clean file, and testmon's character-length variant for a dirty one),
        # so a non-ASCII file does not produce a false red.
        #
        # WHAT IS STILL UNDETECTABLE, stated rather than left to be discovered:
        #   - A test that exists but was never in any database, in a file the
        #     database has no fingerprint for, that is ALSO unchanged against
        #     HEAD. Nothing selects it and nothing flags it. The escalated run
        #     does execute it, so this is invisible only on the incremental path.
        #   - testmon's method-level fingerprints are not re-verified; only the
        #     per-file fsha is. A corrupted `method_checksums` blob that still
        #     hashes to a valid file record would not be caught.
        #   - The gate cannot prove the suite is adequate. It proves what ran.
        #   - The gate's own program is not linted, typed or tested — answer 7
        #     in the header, CHECK-DEBT D2.16.
        #
        # CAN-FAIL DEMONSTRATED, ARC 017 (discharges D3.4) and RE-RUN ARC 018
        # after this change. The plant must be proven SELECTED, not merely
        # present, or it demonstrates nothing:
        #   plant `assert 1 == 2` in scripts/tests/test_check_venv.py
        #     -> testmon reports that file as the changed one
        #     -> a selected count that is neither 0 nor the whole suite
        #     -> FAILED ... naming the file and line, hook exit 1
        #   restore -> sha256 identical -> control re-passes
        # `__pycache__` is purged between plant and restore: CPython validates
        # `.pyc` on (mtime, size), so a pure line swap can leave planted bytecode
        # resident behind byte-identical source (ARC 017's seventh finding).
        #
        # pre-commit runs local hooks with cwd = repo top level, so the relative
        # path to the venv is stable regardless of where `git commit` ran.
        # ---------------------------------------------------------------------
        entry: ./.venv/bin/python scripts/runtime_gate.py
        language: system
        pass_filenames: false
        always_run: true
