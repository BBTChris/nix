repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^databases/schema/
      - id: ruff-format
        exclude: ^databases/schema/

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
        args: ["--fail-on=E,F"]
        exclude: ^databases/schema/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        exclude: ^databases/schema/

  # 1.8.6 -> 1.9.4 (ARC 010). 1.8.6 dies on every file containing a string
  # literal under Python 3.14: node_visitor.visit_Str does `node.s`, and 3.14
  # removed the `.s` alias from ast.Constant. Bandit catches that per file,
  # records "exception while scanning file", and exits 0 — so the gate had
  # scanned 0 of 27 files, with a clean green, since ARC 006. Proven by
  # planting `subprocess.run(cmd, shell=True)`: 1.8.6 passed it, 1.9.4 fails
  # it as B602 and names the line. Two hook entries, not one, so the strict
  # rule set stays whole over production code.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (production)
        args: ["-c", "pyproject.toml"]
        exclude: ^(databases/schema/|scripts/tests/)

      - id: bandit
        alias: bandit-tests
        name: bandit (tests)
        # Scoped skips, each measured against this repo rather than assumed.
        # This narrows three *rules* over the test tree; it does not narrow the
        # gate's *scope* — every file is still scanned, and every other rule
        # (B602 shell=True included) stays live here. See nix_check_contract.md
        # §5.2 on why scope exemptions are the wrong repair.
        #   B101 assert_used  — asserts are pytest's assertion mechanism; 126
        #                       tests, ~100 sites, zero of them a defect.
        #   B404 import subprocess — informational "consider the implications";
        #                       the suite must spawn interpreters to test the
        #                       checks that spawn interpreters.
        #   B603 subprocess-without-shell — fires on the *safe* list form. Every
        #                       site is sys.executable with a literal argv.
        args: ["-c", "pyproject.toml", "--skip", "B101,B404,B603"]
        files: ^scripts/tests/

  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v3.0.0
    hooks:
      - id: complexipy
        exclude: ^databases/schema/

  - repo: local
    hooks:
      - id: pytest-affected
        name: Stage 3 — runtime pass
        # Exit-5 ("no tests collected") tolerance removed (final whole-branch
        # review, I6). It existed only for the pre-R1 window when scripts/ had
        # no tests yet, with a comment promising removal once real tests
        # existed — there are now 126. Tolerating exit 5 today would let a
        # pythonpath/testpaths regression or a stale .testmondata collect zero
        # tests and still pass the gate having run nothing (CLAUDE.md
        # directive 4: fail closed and loud, not silently green on nothing).
        # pre-commit runs local hooks with cwd = repo top level, so this
        # relative path to the venv is stable regardless of where `git commit`
        # was invoked from.
        entry: ./.venv/bin/pytest --testmon
        language: system
        pass_filenames: false
        always_run: true
