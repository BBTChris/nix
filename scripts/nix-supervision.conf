# Nix — the risk spec docs/nics_risk_subsystem_spec_v1.3.md §12.2:616-618 supervision
# policy, as a systemd DROP-IN. One file, adopted per supervised unit by symlinking it
# to /etc/systemd/system/<unit>.d/nix-supervision.conf.
#
#     "Every process systemd-managed with restart policy. N restarts in M minutes ⇒
#      HALT + operator alert — never blind restart-into-trading. Boot-flatten makes
#      any single restart safe by design."
#
# A DROP-IN AND NOT A UNIT, deliberately. No trading daemon exists in this tree yet, so
# a unit file here would have to name an ExecStart that does not exist — an artifact
# asserting a process the repository does not contain. The policy is the part §12.2
# fixes; the ExecStart is each unit's own. Every unit already on this box
# (nix-ibgateway, nix-verify, nix-xvfb, nix-reboot-capture) can adopt this file
# unchanged.
#
# NOT ADOPTED BY ANYTHING TODAY. ARC 034 was not authorised to install, enable, start
# or `daemon-reload` on a box running a live IB Gateway, so this ships as a FILE and
# checks/check_supervision.py gates it as a file. Adoption is owed work.
#
# EVERY NUMBER BELOW IS DERIVED FROM risks/supervision.config.json AND IS CHECKED
# AGAINST IT. check_supervision reads crash_loop_max and crash_loop_window_min through
# scripts/risk_config.py and requires StartLimitBurst and StartLimitIntervalSec to
# equal them: if systemd's limiter and the §12.2 breaker counted to different numbers,
# whichever fired first would decide and the tunable would be a fiction.

[Unit]
# = risks/supervision.config.json crash_loop_window_min (10) * 60
StartLimitIntervalSec=600
# = risks/supervision.config.json crash_loop_max
StartLimitBurst=3
# MUST be `none`. Every other value lets systemd take the consequence — reboot,
# poweroff, or a silent `failed` state — and §12.2:617's consequence is HALT + operator
# alert, which systemd can declare neither of. The decision belongs to
# scripts/nixrisk/supervision.py.
StartLimitAction=none
# The breaker's input. Without this line nothing counts a restart at the moment the
# process actually dies, and the counter has no source.
OnFailure=nix-crash-loop-halt@%n.service

[Service]
# §12.2:616 — "Every process systemd-managed with restart policy". Boot-flatten and
# cold-start reconciliation (§4, V34) are what make any single restart safe; the cap
# above is what stops the third one from being blind.
Restart=always
RestartSec=5
