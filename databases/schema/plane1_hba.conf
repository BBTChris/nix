# ============================================================================
# Nix — PLANE 1: the CONNECTION-LAYER half of sole-writer enforcement
# (v1.0.0, ARC 043 / I8)
#
# Authority: docs/nics_risk_subsystem_spec_v1.3.md §9 ("Limiter = sole writer")
# and §12.10 ("Plane 1 ... NO NEW WRITERS, EVER").
# Companion: databases/schema/plane1_enforcement.sql (the privilege half).
#
# THIS FILE IS THE SOURCE OF TRUTH. The cluster's own pg_hba.conf and
# pg_ident.conf are OUTSIDE ~/nix (the system PostgreSQL cluster is the one
# declared exception to the self-contained home). `scripts/provision_plane1.py
# --enforce` installs the two blocks below into those files between their
# BEGIN/END markers, idempotently; `checks/check_plane1_sole_writer.py` measures
# the EFFECTIVE state by attempting real connections, never by reading a file.
# A config fragment is a claim; a refused connection is a measurement.
#
# WHY THE CONNECTION LAYER AT ALL. A SUPERUSER bypasses every privilege check in
# the executor, and the OS user this tree runs as IS a superuser. pg_hba is the
# one mechanism a superuser does not bypass: the postmaster evaluates it before
# a role's privileges exist. Without these lines the grants in plane1.sql bind
# only a writer that voluntarily announces a non-writer identity, which is
# exactly the "convention, not enforcement" ARC 038 found.
#
# ORDER IS THE WHOLE MECHANISM. pg_hba is FIRST MATCH WINS, so this block must
# be installed ABOVE the distribution's general `local all all peer` line. The
# installer places it at the top of the file for that reason; a block appended
# at the bottom would be unreachable and would look installed.
# ============================================================================

# --- BEGIN nix plane1 sole-writer enforcement (ARC 043) ---------------------
# Administration: cluster superuser over its own socket. DDL, partition
# onboarding and pg_dump have to remain possible, and this is the ONLY path
# left for them. It is deliberately `sudo -u postgres`: a privileged operator
# action, never the ambient default of any Nix process.
local   nix_plane1      postgres                                peer

# The two Plane-1 identities. `peer` + `map=nix_plane1` (see the ident block):
# the kernel names the OS user, the map says which roles that user may become.
local   nix_plane1      nix_limiter,nix_reader                  peer  map=nix_plane1

# EVERYTHING ELSE IS REFUSED, superuser included. This single line is what
# turns the grants in plane1.sql from a convention into an enforcement.
local   nix_plane1      all                                     reject

# Plane 1 is a local record. No network path to it exists, and none is created
# by a later edit to the general `host` lines below this block.
host    nix_plane1      all             0.0.0.0/0               reject
host    nix_plane1      all             ::0/0                   reject

# SCRATCH DATABASES. Every Plane-1 gate and test provisions a throwaway database
# from the shipped DDL and drives the real sink against it as `nix_limiter`.
# Those databases are not the record, they are built and dropped per run, and
# the general `local all all peer` line below cannot authenticate a role whose
# name differs from the OS user's. Without this line the sink could not reach
# its own scratch database and every Plane-1 gate would go CANNOT-MEASURE.
local   all             nix_limiter,nix_reader                  peer  map=nix_plane1
# --- END nix plane1 sole-writer enforcement (ARC 043) -----------------------


# ============================================================================
# pg_ident.conf block. Installed into the cluster's pg_ident.conf, same markers.
#
# MAPNAME   SYSTEM-USERNAME   PG-USERNAME
#
# `bbt` is the OS user the Limiter and every gate run as on this node. Both
# entries are required and neither is redundant: the writer entry is what lets
# the sanctioned sink connect, the reader entry is what lets the schema and
# projection gates read the live record now that the ambient identity cannot.
#
# THIS IS ALSO THE RESIDUAL, NAMED WHERE IT LIVES. Because both entries map the
# same OS user, a process other than the Limiter running as `bbt` may still
# deliberately authenticate as `nix_limiter`. The database cannot tell two
# processes of one OS user apart. Closing that needs a dedicated service account
# and a map naming only it — provisioning scope, recorded in CHECK-DEBT.
# ============================================================================
# --- BEGIN nix plane1 ident map (ARC 043) -----------------------------------
nix_plane1      bbt                     nix_limiter
nix_plane1      bbt                     nix_reader
# --- END nix plane1 ident map (ARC 043) -------------------------------------
