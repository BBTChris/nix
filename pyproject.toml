[tool.bandit]
# databases/schema/ holds verbatim-extracted DB-spec artifacts (source of truth is the
# .docx; Check A in validate_schemas.sh enforces byte-identity) — never lint-fixed here.
exclude_dirs = [".venv", "graphify-out", "databases/schema"]

[tool.ruff]
target-version = "py314"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.pytest.ini_options]
# "scripts/broker" added in ARC 014: the §2A broker seam and its IBKR adapter live in
# scripts/broker/ and import each other flat (`from broker_seam import ...`). Adding the
# directory here rather than a module-level sys.path insert in the test keeps conftest's
# session-wide "sys.path unchanged at session end" guard intact.
pythonpath = ["scripts", "scripts/broker"]
testpaths = ["scripts/tests"]
# ARC 015: the §2A order port is now half coroutines (connect/query_positions/
# query_balance/get_margin — see BrokerOrderPort), so the suite that drives it needs to
# run on an event loop. pytest-asyncio is the industry-standard plugin for that and is
# pinned in checks/pinned_deps.json so check_python_deps covers it.
#
# strict mode, NOT auto, deliberately: auto silently coerces every `async def test_*` on
# to a loop, so a test that was meant to be sync — or one whose async-ness was an
# accident — runs anyway and nobody is asked the question. strict requires the explicit
# @pytest.mark.asyncio, which makes "this test runs on the loop" a written decision. It
# also means a missing marker fails loudly instead of the test being silently skipped as
# an un-awaited coroutine, which is the same class of defect check_await_conformance()
# exists to catch one layer down.
asyncio_mode = "strict"

[tool.pylint.MAIN]
# checks/*.py import nixverify from scripts/ via checks/_preamble.py at runtime.
# pylint does static resolution and cannot see that, so a commit touching only
# checks/ files failed E0401 while the code was correct. Mirrors pytest's
# pythonpath = ["scripts"] above. pre-commit runs hooks from the repo root.
#
# "checks" added alongside "scripts" (final whole-branch review): the mirror-
# image problem. scripts/tests/test_check_node_identity.py and
# test_check_venv.py do `import check_node_identity` / `import check_venv`
# directly, relying on nixverify.loader.load_check() having appended checks/
# to sys.path at runtime — invisible to pylint's static resolution, same as
# the scripts/ case above. This surfaced only when a commit touched those
# test files without also touching the corresponding checks/*.py in the same
# pre-commit invocation (pylint's per-run module search path depends on which
# files are in that run's batch) — a latent fragility, not something the test
# changes themselves introduced.
init-hook = 'import sys; sys.path.insert(0, "scripts"); sys.path.insert(0, "checks"); sys.path.insert(0, "scripts/broker")'
