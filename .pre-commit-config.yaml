repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^databases/schema/
      - id: ruff-format
        exclude: ^databases/schema/

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
        args: ["--fail-on=E,F"]
        exclude: ^databases/schema/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        exclude: ^databases/schema/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^databases/schema/

  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v3.0.0
    hooks:
      - id: complexipy
        exclude: ^databases/schema/

  - repo: local
    hooks:
      - id: pytest-affected
        name: Stage 3 — runtime pass
        # pytest exits 5 ("no tests collected") with an empty repo pre-R1; that's not
        # a real failure here, so it's treated as pass alongside 0. Once scripts/ has
        # real tests, exit 5 becomes a genuine failure again (it can only mean pytest
        # found zero tests despite a non-empty suite existing, e.g. a collection
        # misconfiguration) — not silently masked long-term, just for this arc's state.
        # pre-commit runs local hooks with cwd = repo top level, so this relative
        # path to the venv is stable regardless of where `git commit` was invoked from.
        entry: bash -c './.venv/bin/pytest --testmon; code=$?; [ "$code" = 0 ] || [ "$code" = 5 ]'
        language: system
        pass_filenames: false
        always_run: true
